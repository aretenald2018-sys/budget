name: Wine Data Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit(진단만) or fix(누락 필드 백필)"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - fix
      days:
        description: "최근 N일 생성/수정 표시 기준"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      USER_UID: ${{ secrets.USER_UID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit wine collections
        run: node scripts/wine-audit.mjs --days=${{ inputs.days }} ${{ inputs.mode == 'fix' && '--fix' || '' }}
